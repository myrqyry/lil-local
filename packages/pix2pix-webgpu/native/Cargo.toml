[package]
name = "pix2pix-wgpu"
version = "0.2.0"
edition = "2021"
description = "Zero-dependency Rust + WebGPU (WGSL) inference engine for Pix2Pix U-Net 256"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.95"
wasm-bindgen-futures = "0.4.45"
js-sys = "0.3.72"
wgpu = { version = "23.0.1", default-features = false, features = ["wgsl", "webgpu"] }
bytemuck = { version = "1.19.0", features = ["derive"] }
console_error_panic_hook = "0.1.7"

[dependencies.web-sys]
version = "0.3.72"
features = [
    "Document",
    "Window",
    "Element",
    "HtmlCanvasElement",
    "ImageData",
    "CanvasRenderingContext2d",
    "console",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
